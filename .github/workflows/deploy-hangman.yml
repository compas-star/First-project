name: Deploy Hangman to GitHub Pages

on:
  push:
    branches: [claude/hangman-game-8h63fd, claude/test-coverage-analysis-wnst4w, main]
    paths:
      - 'hangman/**'
      - '.github/workflows/deploy-hangman.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy hangman to gh-pages/hangman
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hangman
          destination_dir: hangman
