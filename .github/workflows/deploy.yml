name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/test-coverage-analysis-wnst4w, claude/usa-driver-simulator-concept-94havd, main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: habit-tracker
        run: npm install

      - name: Build app
        working-directory: habit-tracker
        run: npm run build

      - name: Add the driving game (static files, no build needed)
        run: cp -r driver-sim habit-tracker/dist/driver-sim

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./habit-tracker/dist
