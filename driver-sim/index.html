<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Mother Road - Arizona Driver</title>
<style>
  html, body { margin: 0; overscroll-behavior: none; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; }
  /* the TV picture is laid over the canvas inside this box, so it stays on the TV even if the page is zoomed */
  #stage { position: relative; line-height: 0; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
  #touch { display: none; }
  body.touch #touch { display: block; }
  .tbtn { position: fixed; -webkit-tap-highlight-color: transparent; touch-action: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    color: #f2e2b8; font: bold 13px monospace; letter-spacing: 1px; background: rgba(30, 24, 20, 0.4);
    border: 2px solid rgba(242, 226, 184, 0.45); border-radius: 6px; touch-action: none; z-index: 5; }
  .tbtn.on { background: rgba(255, 211, 106, 0.45); }
  #tLeft, #tRight { bottom: calc(10px + env(safe-area-inset-bottom)); width: 64px; height: 64px; font-size: 24px; }
  #tLeft { left: calc(8px + env(safe-area-inset-left)); }
  #tRight { left: calc(80px + env(safe-area-inset-left)); }
  #tGas, #tBrake { right: calc(8px + env(safe-area-inset-right)); width: 64px; }
  #tGas { bottom: calc(10px + env(safe-area-inset-bottom)); height: 92px; background: rgba(40, 80, 40, 0.45); }
  #tBrake { bottom: calc(110px + env(safe-area-inset-bottom)); height: 64px; background: rgba(90, 30, 30, 0.45); }
  .small { width: 64px; height: 34px; font-size: 10px; letter-spacing: 0; }
  #tHorn { bottom: calc(82px + env(safe-area-inset-bottom)); left: calc(8px + env(safe-area-inset-left)); width: 64px; height: 40px; font-size: 11px; }
  #tCruise { right: calc(80px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); width: 64px; height: 44px; font-size: 11px; }
  #tMenu { right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); width: 48px; height: 40px; font-size: 22px; }
  body.menu #tMenu { background: rgba(255, 211, 106, 0.45); }
  /* the tucked-away buttons: a little panel under the menu button */
  #tPanel { display: none; position: fixed; z-index: 6; right: calc(62px + env(safe-area-inset-right)); top: calc(4px + env(safe-area-inset-top));
    grid-template-columns: repeat(4, 76px); gap: 6px; padding: 6px; background: rgba(20, 16, 14, 0.85); border: 2px solid rgba(242, 226, 184, 0.35); border-radius: 8px; }
  body.touch.playing.menu #tPanel { display: grid; }
  #tPanel .tbtn { position: static; width: 76px; height: 38px; font-size: 11px; }
  body.busmode #tUturn { opacity: 0.35; }
  #tPrev, #tNext { display: none !important; top: calc(8px + env(safe-area-inset-top)); width: 70px; }
  #tPrev { left: calc(50% - 76px); } #tNext { left: calc(50% + 6px); }
  body.junction.playing #tPrev, body.junction.playing #tNext { display: flex !important; }
  #tAction { display: none; left: 50%; transform: translateX(-50%); bottom: calc(40% + 0px); padding: 0 18px; height: 48px;
    font-size: 15px; background: rgba(160, 120, 20, 0.8); border-color: #ffd36a; color: #fff; }
  #tAction.show { display: flex; animation: pulse 0.8s infinite alternate; }
  body:not(.playing) .tbtn { display: none !important; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.65; } }
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: block; position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      color: #c8b48a; font: 12px monospace; z-index: 4; }
    body.playing #rotate { top: 56px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="screen"></canvas></div>
<div id="rotate">TIP: TURN YOUR PHONE SIDEWAYS FOR A BIGGER WINDSHIELD</div>
<div id="touch">
  <div class="tbtn" id="tLeft">&#9664;</div>
  <div class="tbtn" id="tRight">&#9654;</div>
  <div class="tbtn" id="tHorn">HORN</div>
  <div class="tbtn" id="tBrake">BRAKE</div>
  <div class="tbtn" id="tGas">GAS</div>
  <div class="tbtn" id="tCruise">CRUISE</div>
  <div class="tbtn" id="tAction">OPEN DOORS</div>
  <div class="tbtn small" id="tPrev">&#9664; ROAD</div>
  <div class="tbtn small" id="tNext">ROAD &#9654;</div>
  <div class="tbtn" id="tMenu">&#9776;</div>
  <div id="tPanel">
    <div class="tbtn small" id="tRadio">RADIO</div>
    <div class="tbtn small" id="tVhs">VHS</div>
    <div class="tbtn small" id="tMap">MAP</div>
    <div class="tbtn small" id="tLights">LIGHTS</div>
    <div class="tbtn small" id="tWeather">WEATHER</div>
    <div class="tbtn small" id="tUturn">U-TURN</div>
    <div class="tbtn small" id="tMute">SOUND</div>
    <div class="tbtn small" id="tPause">PAUSE</div>
  </div>
</div>
<script>
  if ('ontouchstart' in window || matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
</script>
<script>
  // iOS Safari ignores user-scalable=no: block double-tap and pinch zoom ourselves
  let lastTouch = 0;
  // Only on the game itself and its buttons: a pinch on the black space around the game still works,
  // so if the page ever ends up zoomed in (it can, inside itch.io's frame) you can pinch back out.
  const onGame = e => !!(e.target && e.target.closest && e.target.closest('#stage, .tbtn, #tPanel'));
  document.addEventListener('touchend', e => { const now = Date.now(); if (onGame(e) && now - lastTouch < 400) e.preventDefault(); lastTouch = now; }, { passive: false });
  document.addEventListener('touchmove', e => { if (onGame(e) && (e.touches.length > 1 || e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, e => { if (onGame(e)) e.preventDefault(); }, { passive: false });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
